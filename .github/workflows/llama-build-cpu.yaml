name: Build Release (CPU)

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }} and py-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2025] # 
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: "recursive"

      - name: Verify GLIBC version
        run: ldd --version

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          activate-environment: true
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        env:
          VERBOSE: 1
          CMAKE_ARGS: >-
            -DLLAVA_BUILD=off
            -DGGML_AVX=OFF
            -DGGML_AVX2=OFF
            -DGGML_AVX512=OFF
            -DGGML_FMA=OFF
            -DGGML_F16C=OFF
            -DLLAMA_BUILD_SERVER=OFF
            -DLLAMA_BUILD_TESTS=OFF
            -DLLAMA_BUILD_EXAMPLES=OFF
            -DCMAKE_INSTALL_LIBDIR=llama_cpp/lib
            -DCMAKE_INSTALL_BINDIR=llama_cpp/lib
            -DCMAKE_INSTALL_INCLUDEDIR=llama_cpp/include
            -DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON
            -DCMAKE_BUILD_TYPE=MinSizeRel 
        working-directory: ./vendor/llama-cpp-python
        run: |
          # Rename the release version with +cpu build tag
          sed -i 's/__version__ = "\([^"]*\)"/__version__ = "\1+cpu"/' llama_cpp/__init__.py

          # Build wheel
          uv -v build --no-create-gitignore --python cpython@${{ matrix.python-version }} --wheel

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wheels-py${{ matrix.python-version }}-${{ matrix.os }}
          path: ./vendor/llama-cpp-python/dist/*.whl


  build_sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: "recursive"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          activate-environment: true
          python-version: "3.12"

      - name: Build source distribution
        working-directory: ./vendor/llama-cpp-python
        run: |
          uv -v build --no-create-gitignore --sdist

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sdist
          path:  ./vendor/llama-cpp-python/dist/*.tar.gz

  release:
    name: Release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'dist/*'


